services:
  # 1. FastAPI Web API
  - type: web
    name: seo-automation-api
    env: docker
    dockerfilePath: ./backend/Dockerfile
    context: ./backend
    plan: starter
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: seo-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: seo-redis
          property: connectionString
      - key: USE_CELERY
        value: "true"
      - key: ENVIRONMENT
        value: production

  # 2. Celery Worker (Crawl, Sync, Score, AI)
  - type: worker
    name: seo-automation-worker
    env: docker
    dockerfilePath: ./backend/Dockerfile
    context: ./backend
    dockerCommand: celery -A app.celery_app.celery_app worker -c 4 --loglevel=info
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: seo-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: seo-redis
          property: connectionString

  # 3. Next.js Frontend
  - type: web
    name: seo-automation-frontend
    env: node
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: seo-automation-api
          property: url

databases:
  - name: seo-postgres
    plan: starter

