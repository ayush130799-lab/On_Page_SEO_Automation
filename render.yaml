services:
  # 1. FastAPI Web API
  - type: web
    name: seo-automation-api
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: seo-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: seo-redis
          property: connectionString
      - key: USE_CELERY
        value: "true"
      - key: ENVIRONMENT
        value: production

  # 2. Celery Worker (Crawl, Sync, Score, AI)
  - type: worker
    name: seo-automation-worker
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: celery -A app.celery_app.celery_app worker -c 4 --loglevel=info
    plan: starter
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: seo-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: seo-redis
          property: connectionString

  # 3. Managed Redis Instance
  - type: redis
    name: seo-redis
    plan: free
    ipAllowList: []

databases:
  - name: seo-postgres
    plan: free
