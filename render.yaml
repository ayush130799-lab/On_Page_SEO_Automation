services:
  # 1. FastAPI Web API (Handles API requests and in-process background crawl tasks)
  - type: web
    name: seo-automation-api
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: seo-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: seo-redis
          property: connectionString
      - key: USE_CELERY
        value: "false"
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: "8000"
      - key: CORS_ORIGINS
        value: "*"
      - key: SECRET_KEY
        generateValue: true

  # 2. Managed Redis Instance
  - type: redis
    name: seo-redis
    plan: free
    ipAllowList: []

databases:
  - name: seo-postgres
    plan: free


