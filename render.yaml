services:
  # 1. FastAPI Web API (Handles API requests and in-process background crawl tasks)
  - type: web
    name: seo-automation-api
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: seo-postgres
          property: connectionString
      - key: USE_CELERY
        value: "false"
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: "8000"
      - key: CORS_ORIGINS
        value: "*"
      - key: GOOGLE_REDIRECT_URI
        value: "https://seo-automation-api-nq19.onrender.com/api/integrations/google/callback"
      - key: PRIORITY_METRIC_WINDOW_DAYS
        value: "90"
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: seo-postgres
    plan: free



